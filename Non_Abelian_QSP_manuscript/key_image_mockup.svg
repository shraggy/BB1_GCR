<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <rect x="0" y="0" width="400" height="400" fill="#ffffff"/>

  <!-- LEFT CLUSTER: scattered clocks (disorder / the blur) -->
  <g stroke="#c0524b" stroke-width="4" fill="#ffffff">
    <circle cx="60" cy="155" r="28"/>
    <line x1="60" y1="155" x2="79.1" y2="144" stroke-linecap="round"/>
    <circle cx="60" cy="155" r="3" fill="#c0524b" stroke="none"/>

    <circle cx="130" cy="135" r="28"/>
    <line x1="130" y1="135" x2="109.3" y2="127.5" stroke-linecap="round"/>
    <circle cx="130" cy="135" r="3" fill="#c0524b" stroke="none"/>

    <circle cx="140" cy="205" r="28"/>
    <line x1="140" y1="205" x2="132.5" y2="225.7" stroke-linecap="round"/>
    <circle cx="140" cy="205" r="3" fill="#c0524b" stroke="none"/>

    <circle cx="90" cy="265" r="28"/>
    <line x1="90" y1="265" x2="111.7" y2="268.8" stroke-linecap="round"/>
    <circle cx="90" cy="265" r="3" fill="#c0524b" stroke="none"/>

    <circle cx="40" cy="235" r="28"/>
    <line x1="40" y1="235" x2="36.2" y2="213.3" stroke-linecap="round"/>
    <circle cx="40" cy="235" r="3" fill="#c0524b" stroke="none"/>
  </g>

  <!-- ARROW with spark, the fix -->
  <g stroke="#333333" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="182" y1="200" x2="212" y2="200"/>
    <polyline points="200,188 212,200 200,212"/>
  </g>
  <g stroke="#e8b93f" stroke-width="3" stroke-linecap="round">
    <line x1="198" y1="165" x2="198" y2="177"/>
    <line x1="198" y1="223" x2="198" y2="235"/>
    <line x1="178" y1="200" x2="166" y2="200"/>
    <line x1="182" y1="183" x2="174" y2="175"/>
    <line x1="182" y1="217" x2="174" y2="225"/>
  </g>

  <!-- RIGHT CLUSTER: aligned clocks (resolved / the fix), all hands pointing straight up -->
  <g stroke="#178a72" stroke-width="4" fill="#ffffff">
    <circle cx="280" cy="155" r="28"/>
    <line x1="280" y1="155" x2="280" y2="133" stroke-linecap="round"/>
    <circle cx="280" cy="155" r="3" fill="#178a72" stroke="none"/>

    <circle cx="350" cy="135" r="28"/>
    <line x1="350" y1="135" x2="350" y2="113" stroke-linecap="round"/>
    <circle cx="350" cy="135" r="3" fill="#178a72" stroke="none"/>

    <circle cx="360" cy="205" r="28"/>
    <line x1="360" y1="205" x2="360" y2="183" stroke-linecap="round"/>
    <circle cx="360" cy="205" r="3" fill="#178a72" stroke="none"/>

    <circle cx="310" cy="265" r="28"/>
    <line x1="310" y1="265" x2="310" y2="243" stroke-linecap="round"/>
    <circle cx="310" cy="265" r="3" fill="#178a72" stroke="none"/>

    <circle cx="260" cy="235" r="28"/>
    <line x1="260" y1="235" x2="260" y2="213" stroke-linecap="round"/>
    <circle cx="260" cy="235" r="3" fill="#178a72" stroke="none"/>
  </g>
</svg>
